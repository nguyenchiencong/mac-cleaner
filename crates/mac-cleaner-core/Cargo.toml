[package]
name = "mac-cleaner-core"
version = "0.1.0"
edition = "2021"
authors = ["macOS Cleaner Team"]
description = "Core discovery, planning, and reclamation engine for macOS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
rayon = "1.8"
walkdir = "2.4"
trash = "5.1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[dev-dependencies]
tempfile = "3.9"
